name: Build Kernel for Mi 8 (D8G_Kernel with Clang)

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Kernel (with Clang)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v3

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential curl flex git libncurses5-dev libssl-dev make python3 unzip wget xz-utils

    - name: Compile Kernel with Clang
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CC=clang
        export CLANG_PATH=/usr/bin

        # Confgigurasi
        make O=out dipper_defconfig
        # Compile dengan Clang
        make -j$(nproc) CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy O=out

        # Gabungkan Image.gz dan dtb
        cat out/arch/arm64/boot/Image.gz out/arch/arm64/boot/dts/qcom/*.dtb > out/arch/arm64/boot/Image.gz-dtb

    - name: Upload Image.gz-dtb
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb
        path: out/arch/arm64/boot/Image.gz-dtb
        
